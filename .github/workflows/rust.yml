name: Checks

on:
  push:
    branches: [ "libp2p-next" ]
  pull_request:
    branches: [ "libp2p-next" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-native:
    name: Check (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: cargo check
      # The HTTP Gateway is opt-in and is not covered by the default feature set.
      - run: cargo check --features http-gateway
      # Upload the lockfile immediately after Cargo has resolved the optional
      # dependency graph, before any tests can fail or take a long time.
      - uses: actions/upload-artifact@v4
        with:
          name: http-gateway-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
      - run: cargo test --bin ipfs
      - run: cargo test --features http-gateway http_gateway

  check-wasm:
    name: Check (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown

  test-ipns:
    name: Test IPNS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: cargo test -p rust-ipns
