name: Export IPFS binaries

on:
  push:
    branches:
      - libp2p-next
    tags:
      - "v*"
  pull_request:
    branches:
      - libp2p-next
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipfs-binary-exports-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: aarch64-linux-android
            runner: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain and target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Android NDK
        if: matrix.target == 'aarch64-linux-android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d

      - name: Configure Android API 21 linker
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          NDK_BIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$NDK_BIN" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build standalone ipfs executable
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --bin ipfs --target "$TARGET"

      - name: Package executable
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          # Use a readable tag/branch name while keeping the artifact unique per commit.
          REF_NAME="${GITHUB_REF_NAME//\//-}"
          VERSION="${REF_NAME:-${GITHUB_SHA:0:12}}"
          PACKAGE="ipfs-${VERSION}-${TARGET}"
          mkdir -p dist

          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/ipfs.exe" dist/ipfs.exe
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/ipfs.exe' -DestinationPath '$PACKAGE.zip' -Force"
            echo "archive=$PACKAGE.zip" >> "$GITHUB_OUTPUT"
          else
            install -m 0755 "target/$TARGET/release/ipfs" dist/ipfs
            tar -C dist -czf "$PACKAGE.tar.gz" ipfs
            echo "archive=$PACKAGE.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload standalone executable package
        uses: actions/upload-artifact@v4
        with:
          name: ipfs-${{ matrix.target }}-${{ github.sha }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

  cygwin-smoke:
    name: Run Windows executable under Cygwin
    needs: build
    runs-on: windows-2022
    steps:
      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: ipfs-x86_64-pc-windows-msvc-${{ github.sha }}
          path: windows-dist

      - name: Install Cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          install-dir: C:\tools\cygwin

      - name: Smoke test from Cygwin Bash
        shell: C:\tools\cygwin\bin\bash.exe --login -o igncr -eo pipefail '{0}'
        run: |
          set -euo pipefail
          WORKSPACE="$(cygpath -u "$GITHUB_WORKSPACE")"
          TEMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          IPFS_EXE="$WORKSPACE/windows-dist/ipfs.exe"

          mkdir -p "$TEMP_DIR/rust-ipfs-cygwin/repo"
          printf '%s\n' 'Rust-IPFS Cygwin smoke test' > "$TEMP_DIR/rust-ipfs-cygwin/payload.txt"

          # Cygwin launches the regular Windows PE executable and translates
          # POSIX path arguments for the native process.
          REPO_WIN="$(cygpath -aw "$TEMP_DIR/rust-ipfs-cygwin/repo")"
          INPUT_WIN="$(cygpath -aw "$TEMP_DIR/rust-ipfs-cygwin/payload.txt")"
          "$IPFS_EXE" --help
          CID="$(IPFS_PATH="$REPO_WIN" "$IPFS_EXE" add -n -Q "$INPUT_WIN")"
          test -n "$CID"
          echo "Cygwin -> Windows ipfs.exe OK; hash-only CID: $CID"

  publish-release:
    name: Publish GitHub Release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, cygwin-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
